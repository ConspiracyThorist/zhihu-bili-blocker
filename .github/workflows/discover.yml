name: discover-ups

# 反查「谁在系统性搬运」，产出 ups.json。
#
# 两档节奏，共用同一份文件：
#   每周一 03:00 UTC → 增量：只搜上次之后新增的标题，结果合并进已有条目
#   每月 1 日 04:00 UTC → 深扫：抽样再扫一批，同样合并
#
# 题库涨到一万条后，一次真正的全量要 4 小时（12000 × 1.2 s），
# 超出 45 分钟的 CI 预算，所以两档都带 --limit，按月轮着扫，不再做整体重建。
# 需要真正全量时手动触发 workflow_dispatch（mode=full）并临时调大 timeout。
#
# 放在 CI 而不是客户端：让每个用户的浏览器都去搜一遍既慢又容易被 B 站风控。
on:
  schedule:
    - cron: '0 3 * * 1'
    - cron: '0 4 1 * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '扫描模式'
        required: true
        default: incremental
        type: choice
        options:
          - incremental
          - full

permissions:
  contents: write

concurrency:
  group: discover-ups
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装依赖
        run: npm install --ignore-scripts

      - name: 反查 UP 主
        env:
          # 用环境变量传递，不拼进 shell：避免输入被当成命令执行
          INPUT_MODE: ${{ github.event.inputs.mode }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          MODE="${INPUT_MODE:-incremental}"
          if [ "$SCHEDULE" = "0 4 1 * *" ]; then
            MODE=full
          fi
          case "$MODE" in
            full|incremental) ;;
            *) echo "非法模式：$MODE"; exit 1 ;;
          esac
          echo "扫描模式：$MODE"
          # 45 分钟预算 / 1.2 秒每条 ≈ 2200 条上限，留出重试余量取 1500
          node tools/run-discover.mjs "--$MODE" --limit=1500

      - name: 提交 ups.json
        run: |
          if [ ! -f data/ups.json ]; then
            echo "没有生成 ups.json，跳过"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ups.json
          if git diff --cached --quiet; then
            echo "UP 库无变化"
            exit 0
          fi
          git commit -m "chore: 更新 UP 库（$(date -u +%Y-%m-%d)）"
          # 并发推送时可能被拒绝，先 rebase 再重试几次
          for i in 1 2 3 4 5; do
            if git push; then break; fi
            echo "push 被拒，第 $i 次重试"
            sleep 3
            git pull --rebase --autostash || true
          done